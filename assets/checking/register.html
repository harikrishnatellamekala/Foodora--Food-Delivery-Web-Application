<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpiceFit | Create Account</title>

    <link rel="stylesheet" href="register.css">
</head>

<body>

    <main class="register-page">

        <!-- Background Image -->
        <div class="background-image"></div>


        <!-- Register Form -->
        <section class="register-wrapper">

            <div class="register-card">

                <!-- BRAND -->
                <div class="brand">

                    <div class="brand-mark">
                        SF
                    </div>

                    <div class="brand-name">
                        Spice<span>Fit</span>
                    </div>

                </div>


                <!-- HEADING -->
                <div class="register-heading">

                    <p class="welcome-label">
                        WELCOME TO SPICEFIT
                    </p>

                    <h1>
                        Create Account
                    </h1>

                    <p class="subtitle">
                        Create your account and start ordering
                    </p>

                </div>


                <!-- REGISTER FORM -->
                <form id="registerForm">

                    <!-- FULL NAME + PHONE -->
                    <div class="form-row">

                        <div class="form-group">

                            <label for="name">
                                Full Name
                            </label>

                            <div class="input-container">

                                <input
                                    type="text"
                                    id="name"
                                    name="name"
                                    placeholder="Enter your full name"
                                    autocomplete="name"
                                    required
                                >

                            </div>

                        </div>


                        <div class="form-group">

                            <label for="phone">
                                Phone Number
                            </label>

                            <div class="input-container">

                                <input
                                    type="tel"
                                    id="phone"
                                    name="phone"
                                    placeholder="Enter phone number"
                                    autocomplete="tel"
                                    required
                                >

                            </div>

                        </div>

                    </div>


                    <!-- EMAIL -->
                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <div class="input-container">

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email address"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                    <!-- PASSWORD + CONFIRM PASSWORD -->
                    <div class="form-row">

                        <div class="form-group">

                            <label for="password">
                                Password
                            </label>

                            <div class="input-container">

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="Create password"
                                    autocomplete="new-password"
                                    required
                                >

                                <button
                                    type="button"
                                    class="password-toggle"
                                    data-target="password"
                                >
                                    Show
                                </button>

                            </div>

                        </div>


                        <div class="form-group">

                            <label for="confirmPassword">
                                Confirm Password
                            </label>

                            <div class="input-container">

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    name="confirmPassword"
                                    placeholder="Confirm password"
                                    autocomplete="new-password"
                                    required
                                >

                                <button
                                    type="button"
                                    class="password-toggle"
                                    data-target="confirmPassword"
                                >
                                    Show
                                </button>

                            </div>

                        </div>

                    </div>


                    <!-- CREATE ACCOUNT BUTTON -->
                    <button
                        type="submit"
                        class="register-button"
                        id="registerButton"
                    >

                        <span>
                            Create Account
                        </span>

                        <span class="button-arrow">
                            →
                        </span>

                    </button>

                </form>


                <!-- LOGIN LINK -->
                <div class="login-area">

                    <span>
                        Already have an account?
                    </span>

                    <a href="login.html">
                        Sign In
                    </a>

                </div>


                <!-- FOOTER -->
                <p class="secure-text">
                    Secure registration · SpiceFit
                </p>

            </div>

        </section>

    </main>


    <!-- PASSWORD SHOW / HIDE -->
    <script>

        const toggleButtons =
            document.querySelectorAll(".password-toggle");


        toggleButtons.forEach(function(button) {

            button.addEventListener("click", function() {

                const targetId =
                    button.getAttribute("data-target");

                const input =
                    document.getElementById(targetId);


                if (input.type === "password") {

                    input.type = "text";

                    button.textContent = "Hide";

                } else {

                    input.type = "password";

                    button.textContent = "Show";

                }

            });

        });

    </script>

</body>

</html>
